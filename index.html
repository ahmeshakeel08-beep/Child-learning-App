<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ABC Fun Learning</title>
    <meta name="description" content="A colorful, interactive, child-friendly ABC learning and finger tracing Android app for toddlers and young children." />
    <meta property="og:title" content="ABC Fun Learning" />
    <meta property="og:description" content="A colorful, interactive, child-friendly ABC learning and finger tracing Android app for toddlers and young children." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ABC Fun Learning" />
    <meta name="application-name" content="ABC Fun Learning" />

    <!-- Web App Manifest for Android Launcher Install -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Standard Favicon and High-Resolution Icons for Android Launcher -->
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/pwa-96x96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/pwa-144x144.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/pwa-192x192.png" />
    
    <!-- Apple Touch Icons for iOS & Android Fallbacks -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />

    <!-- Google Fonts for child-friendly typography: Fredoka & Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-indigo-50 font-['Fredoka',sans-serif] select-none touch-manipulation overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker immediately for Android installability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              console.log('ABC Fun Learning Service Worker active:', reg.scope);
            })
            .catch(function (err) {
              console.log('SW registration error:', err);
            });
        });
      }
    </script>
  </body>
</html>
